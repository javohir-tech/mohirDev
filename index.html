<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <div style="margin-top: 20px;">
            <h1>Job Application</h1>
            <h4>Please complete the form below to apply for a position with us.</h4>
        </div>
        <hr>
        <form action="">
            <div>
                <p>Full Name</p>
                <div style="display: flex; gap: 10px;">
                    <div class="input">
                        <input type="text" class="form-control" name="name" required>
                        <label for="name">First Name</label>
                    </div>
                    <div class="input">
                        <input type="text" class="form-control" name="middle" required>
                        <label for="middle">Middle Name</label>
                    </div>
                    <div class="input">
                        <input type="text" class="form-control" name="last" required>
                        <label for="last">Last Name</label>
                    </div>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <p>Body Size</p>
                <div style="display: flex; gap: 10px;">
                    <div class="input">
                        <input type="text" class="form-control" name="height" placeholder="sm" required>
                        <label for="height">Height</label>
                    </div>
                    <div class="input">
                        <input type="text" class="form-control" name="weight" placeholder="kg" required>
                        <label for="weight">Weight</label>
                    </div>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <p>Birth Date</p>
                <div style="display: flex; gap: 10px; ">
                    <div style="flex: 1;">
                        <select class="form-select" aria-label="Default select example" name="monht" required>
                            <option selected>Please select a month</option>
                            <option value="1">Yanvar</option>
                            <option value="2">Fevral</option>
                        </select>
                        <label for="monht">Month</label>
                    </div>
                    <div style="flex: 1;">
                        <select class="form-select" aria-label="Default select example" name="day" required>
                            <option selected>Please select a day</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                        </select>
                        <label for="day">Day</label>
                    </div>
                    <div style="flex: 1;">
                        <select class="form-select" aria-label="Default select example" name="year" required>
                            <option selected>Please select a year</option>
                            <option value="2004">2004</option>
                            <option value="2005">2005</option>
                        </select>
                        <label for="year">Year</label>
                    </div>

                </div>
            </div>

            <div style="margin-top: 30px;">
                <p>Family Status</p>
                <div>
                    <input type="radio" class="form-check-input" name="famStatus" id="divorced">
                    <label for="divorced" class="form-check-label mt-0">Divorced</label>
                </div>
                <div>
                    <input type="radio" class="form-check-input" name="famStatus" id="married">
                    <label for="married" class="form-check-label mt-0">Married</label>
                </div>
                <div>
                    <input type="radio" class="form-check-input" name="famStatus" id="single">
                    <label for="single" class="form-check-label mt-0">Single</label>
                </div>
                <div>
                    <input type="radio" class="form-check-input" name="famStatus" id="others">
                    <label for="others" class="form-check-label mt-0">Others</label>
                </div>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
